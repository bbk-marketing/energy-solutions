server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # bbkenergy.com -> www.bbkenergy.com (una sola URL para Google)
    if ($host = "bbkenergy.com") {
        return 301 https://www.bbkenergy.com$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # rutas limpias para las páginas legales
    location = /terminos     { return 301 /terminos.html; }
    location = /privacidad   { return 301 /privacidad.html; }
    location = /uso-de-datos { return 301 /uso-de-datos.html; }

    location = /site.webmanifest { default_type application/manifest+json; }

    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    error_page 404 /404.html;
}
