server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # rutas limpias para las páginas legales
    location = /terminos     { try_files /terminos.html =404; }
    location = /privacidad   { try_files /privacidad.html =404; }
    location = /uso-de-datos { try_files /uso-de-datos.html =404; }

    location ~* \.(webp|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
